<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Card Event Listeners</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>

        <!-- Title -->
        <header>
            <h1>Todays Focus</h1>
            <p>What's on today's agenda</p>
        </header>

        <!-- Cards -->
        <div class="card-container">

            <!-- Card 1 -->
            <article class="card">
                <h2>Task 1</h2>
            </article>

            <!-- Card 2-->
            <article class="card">
                <h2>Task 2</h2>
            </article>

            <!-- Card 3 -->
            <article class="card">
                <h2>Task 3</h2>
            </article>
        </div>
    </main>
</body>
</html>
